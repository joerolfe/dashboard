<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locked IN</title>
<style>
  :root {
    --text: #fff;
    --muted: rgba(255, 255, 255, .62);
    --faint: rgba(255, 255, 255, .36);
    --hair: rgba(255, 255, 255, .1);
    --glass: rgba(22, 22, 28, .38);
    --stroke: rgba(255, 255, 255, .16);
    --blue: #0A84FF; --green: #30D158; --orange: #FF9F0A; --red: #FF453A;
    --purple: #BF5AF2; --yellow: #FFD60A; --teal: #64D2FF; --pink: #FF375F; --gray: #8E8E93; --indigo: #5E5CE6;
    --r: 24px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
    color: var(--text); background: #0b0b0f; -webkit-font-smoothing: antialiased; letter-spacing: -.01em;
  }
  button, input { font: inherit; color: inherit; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* ---------- background ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; }
  .photo { position: absolute; inset: 0; background: #1a1612 url("bg.jpg") center / cover no-repeat; transform: scale(1.03); }
  .shade { position: absolute; inset: 0; background: linear-gradient(rgba(8,8,12,.42), rgba(8,8,12,.6)); transition: background 1.2s; }
  .glass {
    background: var(--glass); border: 1px solid var(--stroke);
    -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 24px 60px -28px rgba(0,0,0,.7);
  }

  /* ---------- frame: sidebar | header + stage, dock underneath — always one screen ---------- */
  .app {
    position: relative; z-index: 1; height: 100vh; height: 100dvh; max-width: 1600px; margin: 0 auto; padding: 20px 26px 12px;
    display: grid; grid-template-columns: 190px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 16px 18px;
  }
  .side { grid-column: 1; grid-row: 1 / 3; border-radius: 22px; padding: 16px 10px; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: hidden; }
  .top, .stage { grid-column: 2; }
  .dockwrap { grid-column: 1 / -1; }

  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; }
  .hello h1 { font-size: 22px; font-weight: 700; letter-spacing: -.025em; white-space: nowrap; }
  .hello p { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .seg { position: relative; display: flex; padding: 4px; border-radius: 99px; }
  .seg button { all: unset; position: relative; z-index: 1; cursor: pointer; padding: 8px 15px; border-radius: 99px; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: color .25s; }
  .seg button:hover { color: var(--text); }
  .seg button.on { color: #111; }
  .seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 99px; background: rgba(255,255,255,.94); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .weather { justify-self: end; display: flex; align-items: center; gap: 10px; padding: 7px 18px 7px 12px; border-radius: 99px; }
  .weather .wi { font-size: 26px; line-height: 1; cursor: pointer; }
  .weather .wc { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .weather .wl { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- sidebar ---------- */
  .spotbtn { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 11px; background: rgba(255,255,255,.08); font-size: 13px; color: var(--muted); transition: background .2s; }
  .spotbtn:hover { background: rgba(255,255,255,.15); color: var(--text); }
  .spotbtn kbd { margin-left: auto; font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.1); }
  .sgroup { display: flex; flex-direction: column; gap: 1px; }
  .sgroup .cap { padding: 0 10px 6px; }
  .side a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 13.5px; font-weight: 500; transition: background .15s; }
  .side a:hover { background: rgba(255,255,255,.12); }
  .side a span { color: var(--faint); font-size: 12px; opacity: 0; transition: opacity .15s; }
  .side a:hover span { opacity: 1; }

  /* ---------- views + cards ---------- */
  .stage { position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; display: none; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .view.active { display: grid; }
  .w { border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; overflow: hidden; }
  .tall { grid-row: span 2; }
  .wide { grid-column: span 2; }
  .wh { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .wh .ttl { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wh .side-r { display: flex; align-items: center; gap: 8px; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .open { all: unset; cursor: pointer; flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); color: var(--muted); font-size: 12px; transition: background .2s, color .2s; }
  .open:hover { background: rgba(255,255,255,.22); color: var(--text); }
  .cap { flex: none; font-size: 11px; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
  .hint { font-size: 12px; color: var(--faint); font-weight: 500; }
  .empty { color: var(--faint); font-size: 13.5px; text-align: center; margin: auto; padding: 10px; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; margin-right: -8px; padding-right: 8px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
  .scroll > * + * { margin-top: 12px; }
  .fill { flex: 1; min-height: 0; }

  .input { min-width: 0; padding: 8px 12px; border-radius: 11px; font-size: 13.5px; outline: none; background: rgba(255,255,255,.08); border: 1px solid transparent; transition: border-color .2s, background .2s; }
  .input:focus { border-color: rgba(10,132,255,.85); background: rgba(255,255,255,.12); }
  .input::placeholder { color: var(--faint); }
  .btn { all: unset; cursor: pointer; padding: 8px 15px; border-radius: 11px; font-size: 13.5px; font-weight: 600; text-align: center; background: var(--blue); color: #fff; transition: filter .2s; }
  .btn:hover { filter: brightness(1.12); }
  .addrow { flex: none; display: flex; gap: 8px; }
  .addrow .input { flex: 1; }
  .del { all: unset; cursor: pointer; opacity: 0; color: var(--faint); font-size: 16px; padding: 0 4px; }
  .del:hover { color: var(--red); }

  /* shared visuals */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 10px; border-radius: 99px; background: rgba(255,255,255,.09); font-size: 12.5px; font-weight: 500; line-height: 1.3; }
  .chip.c { background: color-mix(in srgb, var(--c) 24%, transparent); color: color-mix(in srgb, var(--c) 70%, white); font-weight: 700; }
  .chip.off { color: var(--faint); text-decoration: line-through; }
  .mini { padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.06); }
  .mini h5 { font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
  .mini p, .mini li { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .mini ul { padding-left: 16px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat b { display: block; font-size: 24px; font-weight: 750; letter-spacing: -.03em; line-height: 1.1; }
  .stat small { display: block; font-size: 11.5px; color: var(--faint); margin-top: 3px; line-height: 1.3; }
  .pbar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .pbar i { display: block; height: 100%; width: var(--p, 0%); border-radius: 99px; background: var(--c, var(--green)); transition: width .8s cubic-bezier(.22,1,.36,1); }
  .prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; align-items: center; font-size: 13px; }
  .prow .pbar { grid-column: 1 / -1; }
  .prow em { font-style: normal; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .rows { list-style: none; padding: 0; display: flex; flex-direction: column; }
  .rows li { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-top: 1px solid var(--hair); font-size: 13px; line-height: 1.4; }
  .rows li:first-child { border-top: 0; }
  .rows li em { flex: none; min-width: 58px; font-style: normal; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .rows li .r { margin-left: auto; flex: none; font-size: 12px; color: var(--faint); }
  .rows li.now { color: #fff; }
  .rows li.now em { color: var(--green); font-weight: 700; }
  .rows li.past { color: var(--faint); }
  .ck { flex: none; width: 15px; height: 15px; margin-top: 2px; border-radius: 5px; border: 1.6px solid var(--faint); display: inline-grid; place-items: center; }
  .ck.on { background: var(--green); border-color: var(--green); }
  .ck.on::after, .tk.on::after { content: ""; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .tl { list-style: none; padding: 0; position: relative; }
  .tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; border-radius: 2px; background: rgba(255,255,255,.12); }
  .tl li { position: relative; padding: 0 0 12px 22px; font-size: 13px; line-height: 1.4; }
  .tl li::before { content: ""; position: absolute; left: 0; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #1d1d22; border: 2px solid var(--c, var(--blue)); }
  .tl li.done::before { background: var(--c, var(--green)); }
  .tl li b { display: block; font-size: 13.5px; }
  .tl li small { display: block; color: var(--faint); font-size: 12px; }
  .tl li.late small { color: var(--red); }
  .big { font-size: 40px; font-weight: 750; letter-spacing: -.04em; line-height: 1; }
  .big small { display: block; margin-top: 5px; font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
  .tile { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 13px; background: rgba(255,255,255,.06); cursor: pointer; font-size: 13px; font-weight: 600; transition: background .2s; min-width: 0; }
  .tile:hover { background: rgba(255,255,255,.14); }
  .tile .ti { font-size: 17px; flex: none; }
  .tile span:last-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile small { display: block; font-weight: 500; font-size: 11.5px; color: var(--faint); }
  .daystrip { display: flex; gap: 4px; }
  .daystrip button { all: unset; cursor: pointer; flex: 1; text-align: center; padding: 5px 0; border-radius: 9px; font-size: 11.5px; font-weight: 700; color: var(--muted); background: rgba(255,255,255,.05); transition: background .2s; }
  .daystrip button:hover { background: rgba(255,255,255,.12); }
  .daystrip button.today { box-shadow: inset 0 0 0 1px rgba(255,69,58,.8); }
  .daystrip button.on { background: rgba(255,255,255,.9); color: #111; }
  .quote { padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.06); border-left: 3px solid var(--purple); font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.85); }
  .tbl { overflow-x: auto; border: 1px solid var(--hair); border-radius: 13px; }
  .tbl table { width: 100%; border-collapse: collapse; font-size: 12.5px; line-height: 1.4; }
  .tbl th, .tbl td { padding: 7px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--hair); }
  .tbl th { background: rgba(255,255,255,.07); font-weight: 700; white-space: nowrap; }
  .tbl tbody tr:last-child td { border-bottom: 0; }
  .tbl td.hl, .tbl th.hl { background: rgba(255,69,58,.14); }

  /* ---------- today ---------- */
  #v-today { grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); }
  .ring { position: relative; width: 50px; height: 50px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
  .ring .track { stroke: rgba(255,255,255,.12); }
  .ring .bar { transition: stroke-dashoffset .8s cubic-bezier(.22,1,.36,1); }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .gtop { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .gtop h2 { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
  .gtop p { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .glist { list-style: none; padding: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1px; }
  .glist li { flex: 1 1 0; min-height: 0; max-height: 40px; display: flex; align-items: center; gap: 11px; padding: 0 8px; border-radius: 11px; cursor: pointer; transition: background .15s; }
  .glist li:hover { background: rgba(255,255,255,.07); }
  .glist li:hover .del { opacity: 1; }
  .check { flex: none; width: 19px; height: 19px; border-radius: 50%; border: 2px solid var(--faint); display: grid; place-items: center; transition: background .2s, border-color .2s; }
  .glist li.done .check, .ex.done .check { background: var(--green); border-color: var(--green); }
  .glist li.done .check::after, .ex.done .check::after, .box.on::after { content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .glist .t { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glist li.done .t { color: var(--faint); text-decoration: line-through; }
  .wknav { display: flex; align-items: center; gap: 6px; }
  .wknav button { all: unset; cursor: pointer; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); color: var(--text); font-size: 14px; }
  .wknav button:hover { background: rgba(255,255,255,.2); }
  .wknav span { min-width: 104px; text-align: center; color: var(--text); }
  .trk { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 20px; }
  .tgrid { display: grid; grid-template-columns: minmax(100px, 1.6fr) repeat(7, minmax(24px, 1fr)); column-gap: 4px; row-gap: 1px; min-height: 0; }
  .tgrid.blank { display: flex; }
  .gname { align-self: center; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
  .dh { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-bottom: 4px; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .dh b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: var(--text); }
  .dh.today b { background: var(--red); }
  .cell { display: grid; place-items: center; border-radius: 7px; }
  .cell.today { background: rgba(255,255,255,.06); }
  .box { width: clamp(14px, 2.2vh, 19px); height: clamp(14px, 2.2vh, 19px); border-radius: 6px; border: 1.6px solid rgba(255,255,255,.28); cursor: pointer; display: grid; place-items: center; transition: background .15s, border-color .15s; }
  .box:hover { border-color: rgba(255,255,255,.7); }
  .box.on { background: var(--green); border-color: var(--green); }
  .foot { padding-top: 4px; text-align: center; font-size: 11px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; }
  .foot.full { color: var(--green); }
  .tstats { min-height: 0; display: flex; flex-direction: column; gap: 8px; padding-left: 18px; border-left: 1px solid var(--hair); }
  .srow { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--hair); }
  .srow span { color: var(--muted); }
  .bars { flex: 1; min-height: 36px; display: flex; gap: 6px; align-items: flex-end; }
  .bars div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; font-size: 10.5px; color: var(--muted); }
  .bars i { display: block; width: 100%; min-height: 3px; border-radius: 5px; background: rgba(10,132,255,.75); transform-origin: bottom; }
  .bars div.cur i { background: var(--green); }

  /* ---------- gym workout ---------- */
  .wtabs { display: flex; gap: 4px; }
  .wtabs button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--muted); background: rgba(255,255,255,.06); white-space: nowrap; }
  .wtabs button.on { color: #fff; background: color-mix(in srgb, var(--c) 34%, transparent); }
  .wprog { flex: none; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .wprog .track { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .wprog .track i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .6s cubic-bezier(.22,1,.36,1); }
  .wlist { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1px; }
  .ex { flex: 1 1 0; min-height: 0; max-height: 52px; display: flex; align-items: center; gap: 11px; padding: 0 8px; border-radius: 11px; cursor: pointer; transition: background .15s; }
  .ex:hover { background: rgba(255,255,255,.07); }
  .ex .nm { flex: 1; min-width: 0; }
  .ex .nm b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex .nm small { display: block; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex.done .nm b { color: var(--faint); text-decoration: line-through; }
  .ex .kg { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ex .kg b { font-size: 14px; font-weight: 700; }
  .ex .kg small { display: block; font-size: 11px; font-weight: 600; color: var(--green); }
  .ex .acts { display: flex; gap: 3px; opacity: 0; transition: opacity .15s; }
  .ex:hover .acts { opacity: 1; }
  .ex .acts button { all: unset; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: rgba(255,255,255,.12); }
  .ex .acts button:hover { background: rgba(255,255,255,.26); }
  .ex .acts button[data-a="hit"] { color: var(--green); }
  .wadd { flex: none; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.4fr) 56px 56px auto; gap: 6px; }
  .wadd .btn { padding: 8px 12px; }

  /* ---------- charts ---------- */
  .vbars { flex: 1; min-height: 70px; position: relative; display: flex; gap: 8px; align-items: flex-end; padding-top: 14px; }
  .vbars .b { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .vbars .bw { flex: 1; width: 100%; position: relative; display: flex; align-items: flex-end; }
  .vbars .b i { display: block; width: 100%; border-radius: 7px 7px 3px 3px; background: linear-gradient(var(--orange), rgba(255,159,10,.3)); transform-origin: bottom; }
  .vbars .bw u { position: absolute; left: -4px; right: -4px; border-top: 1.5px dashed rgba(255,255,255,.5); pointer-events: none; }
  .vbars .b.today i { background: linear-gradient(#fff, rgba(255,255,255,.35)); }
  .vbars .b.today { color: #fff; font-weight: 700; }
  .vbars .tgt { position: absolute; left: 0; right: 0; border-top: 1.5px dashed rgba(255,255,255,.45); pointer-events: none; }
  .vbars .tgt span { position: absolute; right: 0; top: -15px; font-size: 10.5px; color: var(--muted); }
  .donut { display: flex; align-items: center; gap: 16px; }
  .donut svg { width: 118px; height: 118px; flex: none; transform: rotate(-90deg); }
  .donut circle { fill: none; stroke-width: 15; transition: stroke-dasharray .9s cubic-bezier(.22,1,.36,1); }
  .donut .ctr { position: relative; }
  .donut .ctr b { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 19px; font-weight: 750; line-height: 1.1; }
  .donut .ctr b small { display: block; font-size: 10.5px; font-weight: 600; color: var(--faint); }
  .legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend div b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
  .hbar { display: grid; grid-template-columns: 70px minmax(0, 1fr) 50px; align-items: center; gap: 10px; font-size: 12.5px; }
  .hbar .track { height: 10px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .hbar .track i { display: block; height: 100%; width: var(--p); border-radius: 99px; background: var(--c); transition: width .8s cubic-bezier(.22,1,.36,1); }

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const NAME = "Joseph"; // change me
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- motion helpers (Motion, the framer-motion engine; no-ops if unavailable) ---------- */
const M = matchMedia("(prefers-reduced-motion: reduce)").matches ? null : window.Motion;
const ease = [.22, 1, .36, 1];
const spring = { type: "spring", stiffness: 420, damping: 30 };
function countTo(el, to, fmtFn = v => Math.round(v), from) {
  from = from ?? parseFloat(el.dataset.v ?? 0); el.dataset.v = to;
  if (!M || from === to) { el.textContent = fmtFn(to); return; }
  M.animate(from, to, { duration: .8, ease, onUpdate: v => { el.textContent = fmtFn(v); } });
}
const pop = el => { if (M && el) M.animate(el, { scale: [.7, 1.15, 1] }, { duration: .35 }); };
const ringTo = (el, circ, p) => { el.style.strokeDashoffset = circ * (1 - Math.max(0, Math.min(1, p))); };

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => fmt(new Date());
const uid = () => Math.random().toString(36).slice(2, 9);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const weekDates = start => Array.from({ length: 7 }, (_, i) => addDays(start, i));
const short = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const todayName = () => DAYS[(new Date().getDay() + 6) % 7];

function tick() {
  const n = new Date(), h = n.getHours();
  const part = h < 5 ? "night" : h < 12 ? "morning" : h < 17 ? "afternoon" : h < 21 ? "evening" : "night";
  $("greeting").textContent = `Good ${part}, ${NAME}`;
  $("date").textContent = n.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  $("gDate").textContent = n.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
}
tick(); setInterval(tick, 60000);

/* =====================================================================
   NOTION SNAPSHOT — read-only copy of Locked IN (notion-data.js)
   ===================================================================== */
const ND = window.NOTION || { groups: [], pages: {}, snapshot: "" };
const NP = ND.pages;
const pg = s => NP[s] || { slug: s, title: s, icon: "📄", md: "", children: [], kind: "page" };
const L = t => (t || "").split("\n");

// markdown → html (headings, lists + tasks, tables, quotes, rules, bold/italic/br)
function mdInline(s) {
  return esc(s).replace(/\\\|/g, "|")
    .replace(/&lt;(\/?)(b|i|br)\s*\/?&gt;/g, "<$1$2>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
const strip = s => mdInline(s).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&");
const cellsOf = r => r.trim().replace(/\\\|/g, "\u0000").replace(/^\||\|$/g, "").split("|").map(c => c.replace(/\u0000/g, "\\|").trim());
const isSep = r => /^\s*\|(\s*:?-+:?\s*\|)+\s*$/.test(r);
function tableRows(t) {                          // first table in t → rows of cells (separator dropped)
  const out = []; let on = false;
  for (const l of L(t)) { if (/^\s*\|/.test(l)) { on = true; if (!isSep(l)) out.push(cellsOf(l)); } else if (on) break; }
  return out;
}
function mdTable(rows) {
  const head = rows.length > 1 && isSep(rows[1]), body = rows.filter(r => !isSep(r)), [first, ...rest] = body;
  const tr = (r, tag) => `<tr>${cellsOf(r).map(c => `<${tag}>${mdInline(c)}</${tag}>`).join("")}</tr>`;
  return `<div class="tbl"><table>${head ? `<thead>${tr(first, "th")}</thead>` : tr(first, "td")}<tbody>${rest.map(r => tr(r, "td")).join("")}</tbody></table></div>`;
}
function mdList(lines) {
  const root = { kids: [] }, stack = [{ ind: -1, node: root }];
  lines.forEach(line => {
    const m = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)/), ind = m[1].length;
    while (stack.length > 1 && ind <= stack[stack.length - 1].ind) stack.pop();
    const item = { text: m[3], ordered: /\d/.test(m[2]), kids: [] };
    stack[stack.length - 1].node.kids.push(item); stack.push({ ind, node: item });
  });
  const render = kids => {
    if (!kids.length) return "";
    const tag = kids[0].ordered ? "ol" : "ul";
    return `<${tag}>` + kids.map(k => {
      const t = k.text.match(/^\[( |x)\]\s*(.*)/i);
      return t ? `<li class="task${t[1] !== " " ? " done" : ""}"><span class="tk${t[1] !== " " ? " on" : ""}"></span><span class="tt">${mdInline(t[2])}</span>${render(k.kids)}</li>`
               : `<li>${mdInline(k.text)}${render(k.kids)}</li>`;
    }).join("") + `</${tag}>`;
  };
  return render(root.kids);
}
function md(src) {
  const lines = L(src), isRow = l => /^\s*\|/.test(l), isLi = l => /^\s*([-*]|\d+\.)\s+/.test(l);
  let i = 0, out = "";
  while (i < lines.length) {
    const l = lines[i]; let m;
    if (!l.trim()) { i++; continue; }
    if (/^---+\s*$/.test(l)) { out += "<hr>"; i++; continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { out += `<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^>/.test(l)) { const q = []; while (i < lines.length && /^>/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, "")); out += `<blockquote>${mdInline(q.join(" "))}</blockquote>`; continue; }
    if (isRow(l)) { const rows = []; while (i < lines.length && isRow(lines[i])) rows.push(lines[i++]); out += mdTable(rows); continue; }
    if (isLi(l)) { const items = []; while (i < lines.length && isLi(lines[i])) items.push(lines[i++]); out += mdList(items); continue; }
    const p = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|---+\s*$|>|\s*\||\s*([-*]|\d+\.)\s)/.test(lines[i])) p.push(lines[i++]);
    out += `<p>${mdInline(p.join(" "))}</p>`;
  }
  return out;
}
// text under the first heading matching re, up to the next heading of the same or higher level
function under(t, re, anyLevel) {
  let out = null, lvl = 0;
  for (const l of L(t)) {
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (out) { if (h && (anyLevel || h[1].length <= lvl)) break; out.push(l); }
    else if (h && re.test(strip(h[2]).trim())) { out = []; lvl = h[1].length; }
  }
  return (out || []).join("\n");
}
const tasks = t => L(t).map(l => l.match(/^\s*- \[( |x)\]\s*(.*)/i)).filter(Boolean).map(m => ({ done: m[1] !== " ", t: m[2] }));
const bullets = t => L(t).map(l => l.match(/^\s*(?:-|\d+\.)\s+(?!\[[ x]\])(.*)/i)).filter(Boolean).map(m => m[1]);
function tasksByHeading(t) {
  const out = []; let cur = null;
  L(t).forEach(l => {
    const h = l.match(/^#{1,4}\s+(.*)/);
    if (h) { cur = { h: strip(h[1]).replace(/:\s*$/, "").trim(), tasks: [], lines: [] }; out.push(cur); return; }
    if (!cur) return;
    cur.lines.push(l);
    const m = l.match(/^\s*- \[( |x)\]\s*(.*)/i); if (m) cur.tasks.push({ done: m[1] !== " ", t: m[2] });
  });
  return out.filter(x => x.tasks.length);
}

// databases
function dbHTML(d) {
  if (d.kind === "plan") return `<div class="plan">${d.days.map(x => `<div class="pday${x.day === todayName() ? " today" : ""}"><h4>${esc(x.day)}${x.day === todayName() ? " · today" : ""}</h4><ol>${x.items.map(t => `<li>${mdInline(t)}</li>`).join("")}</ol></div>`).join("")}</div>`;
  const cell = v => v === true ? `<span class="tk on"></span>` : v === false ? `<span class="tk"></span>` : /^\d{4}-\d\d-\d\d$/.test(v) ? short(parseDay(v)) : mdInline(String(v));
  return `<div class="tbl"><table><thead><tr>${d.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${d.rows.map(r => `<tr>${r.map(v => `<td>${cell(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const plain = s => (s || "").replace(/<[^>]+>/g, " ").replace(/[#*>|`\\-]|\[( |x)\]/g, " ").replace(/\s+/g, " ").trim();
function preview(p) {
  if (p.kind === "db") return p.db.rows ? `${p.db.rows.length} entries` : `${p.db.days.length} days`;
  if (p.children.length) return `${p.children.reduce((n, c) => n + c.slugs.length, 0)} pages`;

      if (a === "del") { if (confirm(`Remove ${e.name} from ${wType}?`)) { list.splice(i, 1); saveGym(); renderWork(); } return; }
      gym.sess[k] = done; done[e.id] = !done[e.id]; saveGym();
      if (isToday && list.every(x => done[x.id])) syncGymTask(k, true);   // whole session done → tick the Gym daily task
      renderWork({ pop: e.id });
    };
    box.appendChild(row);
  });
  if (!M || !fx) return;
  if (fx.pop) pop(box.querySelector(`[data-id="${fx.pop}"] .check`));
  if (fx.hit) M.animate(box.querySelector(`[data-id="${fx.hit}"] .kg`), { scale: [1.25, 1] }, { duration: .5, ease });
  if (fx.add) M.animate(box.querySelector(`[data-id="${fx.add}"]`), { opacity: [0, 1], x: [-16, 0] }, spring);
  if (fx.swap) M.animate(box.children, { opacity: [0, 1], y: [8, 0] }, { delay: M.stagger(.025), duration: .35, ease });
}

     <div class="scroll"><ul class="rows">${rows.map(r => `<li class="${isToday(r[1]) ? "now" : ""}"><span class="ck${/☑|✓/.test(r[4]) ? " on" : ""}"></span><em>${esc(r[1])}</em><span>${esc(r[3])}<br><span class="hint">pages ${esc(r[2])}</span></span></li>`).join("")}</ul>
       <p class="hint">${mdInline((sm.md.match(/Each session is roughly[^\n]*/) || [""])[0])}</p></div>`;
}

/* =====================================================================
   DOCK + SIDEBAR — links (not Notion content)
   ===================================================================== */
const gstatic = host => `https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent("https://" + host)}&size=128`;
function iconEl(item) {
  const ic = document.createElement("div"); ic.className = "ic";
  let host = ""; try { host = new URL(item.url).hostname; } catch {}
  const slug = item.slug ?? (host.startsWith("studio.youtube") ? "youtubestudio" : host.replace(/^www\./, "").split(".")[0]);
  const stages = (slug ? [`https://cdn.simpleicons.org/${slug}`] : []).concat(gstatic(host));
  const img = new Image(); let n = 0; img.alt = "";
  img.onerror = () => { if (++n < stages.length) img.src = stages[n]; else ic.innerHTML = `<b>${esc((item.name || "?")[0].toUpperCase())}</b>`; };
  img.src = stages[0]; ic.appendChild(img);
  return ic;
}
let links = store.get("links", [{ name: "Amazon", url: "https://www.amazon.com" }, { name: "YT Studio", url: "https://studio.youtube.com" }, { name: "FUT.GG", url: "https://www.fut.gg" }]);
function renderDock() {
  const dock = $("dock"); dock.innerHTML = "";
  links.forEach(l => {
    const a = document.createElement("a"); a.className = "di"; a.href = l.url;
    a.appendChild(iconEl(l)); a.insertAdjacentHTML("beforeend", `<span class="tip">${esc(l.name)}</span>`);
    a.addEventListener("click", e => {
      if (!M || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
      e.preventDefault(); M.animate(a.querySelector(".ic"), { y: [0, -16, 0] }, { duration: .45, ease: "easeOut" });
      setTimeout(() => { location.href = l.url; }, 260);
    });
    a.addEventListener("contextmenu", e => { e.preventDefault(); if (confirm(`Remove ${l.name} from the Dock?`)) { links = links.filter(x => x !== l); store.set("links", links); renderDock(); } });
    dock.appendChild(a);
  });
  dock.insertAdjacentHTML("beforeend", `<div class="sep"></div>`);
  const add = document.createElement("div"); add.className = "di add";
  add.innerHTML = `<div class="ic">+</div><span class="tip">Add to Dock</span>`;
  add.onclick = () => {
    let url = prompt("Link URL (e.g. gmail.com):"); if (!url) return; url = url.trim();
    if (!/^https?:\/\//.test(url)) url = "https://" + url;
    let host; try { host = new URL(url).hostname.replace(/^www\./, ""); } catch { return alert("That doesn't look like a URL."); }
    links.push({ name: (prompt("Name:", host.split(".")[0]) || host).trim(), url }); store.set("links", links); renderDock();
  };
  dock.appendChild(add);
}
(() => {   // macOS-style magnification
  const dock = $("dock"), BASE = 48, MAX = 74, RANGE = 140; let x = null, raf = 0;
  const paint = () => { raf = 0; dock.querySelectorAll(".di").forEach(it => { let s = BASE; if (x !== null) { const r = it.getBoundingClientRect(), k = Math.max(0, 1 - Math.abs(x - (r.left + r.width / 2)) / RANGE); s = BASE + (MAX - BASE) * k * k * (3 - 2 * k); } it.style.width = it.style.height = s + "px"; }); };
  if (matchMedia("(hover: hover)").matches) {
    dock.addEventListener("mousemove", e => { x = e.clientX; if (!raf) raf = requestAnimationFrame(paint); });
    dock.addEventListener("mouseleave", () => { x = null; if (!raf) raf = requestAnimationFrame(paint); });
  }
})();
const TRACKERS = [["Calorie Tracker", "https://calorie-tracker-ruddy-seven.vercel.app"], ["Flux Planner", "https://flux-content-planner.vercel.app"], ["Monthly Outgoings", "https://monthlyoutgoings.vercel.app"], ["Movie Tracker", "https://movietracker-seven.vercel.app"]];
const UNI = [["Canvas", "https://bsdc.instructure.com"], ["Learner App Hub", "https://www.bsdc.ac.uk/learner-app-access-hub"], ["Teams", "https://teams.cloud.microsoft"], ["NetAcad", "https://www.netacad.com/dashboard"]];
$("side").innerHTML = `<button class="spotbtn" id="spotBtn">🔍 Search Notion<kbd>⌘K</kbd></button>` +
  [["Trackers", TRACKERS], ["Uni", UNI]].map(([t, items]) => `<nav class="sgroup"><div class="cap">${t}</div>${items.map(([n, u]) => `<a href="${u}">${esc(n)}<span>↗</span></a>`).join("")}</nav>`).join("") +
  `<div class="hint" style="margin-top:auto;padding:0 10px">Notion snapshot · ${ND.snapshot ? short(parseDay(ND.snapshot)) : "none"}</div>`;
$("spotBtn").onclick = openSpot;

/* =====================================================================
   WEATHER (Open-Meteo) — today's high/low and conditions
   ===================================================================== */
const WMO = { 0: ["Sunny", "☀️"], 1: ["Sunny", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"], 45: ["Fog", "🌫️"], 48: ["Fog", "🌫️"],
  51: ["Drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Drizzle", "🌧️"], 56: ["Freezing drizzle", "🌧️"], 57: ["Freezing drizzle", "🌧️"],
  61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"], 66: ["Freezing rain", "🌧️"], 67: ["Freezing rain", "🌧️"],
  71: ["Light snow", "🌨️"], 73: ["Snow", "❄️"], 75: ["Heavy snow", "❄️"], 77: ["Snow", "❄️"], 80: ["Showers", "🌦️"], 81: ["Showers", "🌧️"], 82: ["Heavy showers", "⛈️"],
  85: ["Snow showers", "🌨️"], 86: ["Snow showers", "🌨️"], 95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm", "⛈️"], 99: ["Thunderstorm", "⛈️"] };
let wx = null;
function renderWeather() {
  if (!wx) return;
  const c = wx.current, d = wx.daily, code = d.weather_code ? d.weather_code[0] : c.weather_code, [txt, ico] = WMO[code] || ["—", "🌡️"];
  $("wIcon").textContent = ico; $("wCond").textContent = txt;
  $("wHL").textContent = `H ${Math.round(d.temperature_2m_max[0])}°  ·  L ${Math.round(d.temperature_2m_min[0])}°`;
  const a = !c.is_day ? .72 : c.weather_code >= 51 ? .56 : .42;
  $("shade").style.background = `linear-gradient(rgba(8,8,12,${a}), rgba(8,8,12,${a + .18}))`;
}
async function fetchWeather(lat, lon) {
  const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
  if (!r.ok) throw new Error("weather");
  wx = await r.json(); store.set("wxCache", { t: Date.now(), wx }); renderWeather();
}
async function ipLocate() { const j = await (await fetch("https://ipapi.co/json/")).json(); if (!j.latitude) throw new Error("ip"); return { lat: j.latitude, lon: j.longitude, name: j.city }; }
const geoLocate = () => new Promise((res, rej) => { if (!navigator.geolocation) return rej(); navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lon: p.coords.longitude }), rej, { timeout: 6000 }); });
async function searchCity(q) { const j = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1`)).json(); const p = j.results && j.results[0]; if (!p) throw new Error("none"); return { lat: p.latitude, lon: p.longitude, name: p.name }; }
$("wIcon").onclick = async () => {
  const q = prompt("Enter a city (leave blank to auto-detect):"); if (q === null) return;
  try { const place = q.trim() ? await searchCity(q.trim()) : await ipLocate(); store.set("place", place); await fetchWeather(place.lat, place.lon); } catch { alert("Couldn't find that place."); }
};
(async () => {
  const cache = store.get("wxCache", null);
  if (cache && cache.wx && cache.wx.daily) { wx = cache.wx; renderWeather(); }
  if (cache && Date.now() - cache.t < 10 * 60000 && cache.wx.daily && cache.wx.daily.weather_code) return;
  try { let place = store.get("place", null); if (!place) { try { place = await ipLocate(); } catch { place = await geoLocate(); } store.set("place", place); } await fetchWeather(place.lat, place.lon); }
  catch { if (!wx) { $("wCond").textContent = "Weather unavailable"; $("wHL").textContent = "Click the icon to set your city"; $("wIcon").textContent = "🌡️"; } }
})();
setInterval(() => { const p = store.get("place", null); if (p) fetchWeather(p.lat, p.lon).catch(() => {}); }, 15 * 60000);

/* =====================================================================
   SECTIONS — segmented pill with a sliding thumb, cross-fading views
   ===================================================================== */
const SECTIONS = [["today", "Today"], ["goals", "Goals"], ["physical", "Physical"], ["money", "Money"], ["content", "Content"], ["rel", "Relationships"], ["mind", "Mind"]];
const VIEWS = SECTIONS.map(s => s[0]);
$("seg").insertAdjacentHTML("beforeend", SECTIONS.map(([v, t]) => `<button data-v="${v}">${t}</button>`).join(""));
let view = VIEWS.includes(store.get("view2")) ? store.get("view2") : "today";
function moveThumb(instant) {
  const b = document.querySelector(`#seg button[data-v="${view}"]`), th = $("thumb");
  document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b));
  if (M) M.animate(th, { x: b.offsetLeft, width: b.offsetWidth }, instant ? { duration: 0 } : { type: "spring", stiffness: 520, damping: 40 });
  else { th.style.transform = `translateX(${b.offsetLeft}px)`; th.style.width = b.offsetWidth + "px"; }
}
function show(next, first) {
  if (next === view && !first) return;
  const prev = view, dir = VIEWS.indexOf(next) > VIEWS.indexOf(prev) ? 1 : -1;
  view = next; store.set("view2", view); moveThumb(first);
  const nx = $("v-" + next), pv = $("v-" + prev);
  document.querySelectorAll(".view").forEach(v => { if (v !== nx && (v !== pv || first || !M)) v.classList.remove("active"); });
  nx.classList.add("active");
  if (!M) return;
  // plain WAAPI so nothing is left stuck at opacity 0 when a view comes back
  const curve = "cubic-bezier(.22,1,.36,1)";
  const reset = el => { el.getAnimations().forEach(a => a.cancel()); el.style.opacity = ""; el.style.transform = ""; };
  if (!first && pv !== nx) {
    pv.style.pointerEvents = "none";
    const outs = [...pv.querySelectorAll(":scope > .w")].map(c => c.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-10px) scale(.98)" }], { duration: 180, easing: curve, fill: "forwards" }));
    Promise.all(outs.map(a => a.finished)).then(() => { if (view !== prev) { pv.classList.remove("active"); outs.forEach(a => a.cancel()); } }).catch(() => {}).finally(() => { pv.style.pointerEvents = ""; });
  }
  reset(nx);
  nx.animate([{ transform: `translateX(${first ? 0 : dir * 36}px)` }, { transform: "none" }], { duration: 500, easing: curve });
  [...nx.querySelectorAll(":scope > .w")].forEach((c, i) => { reset(c); c.animate([{ opacity: 0, transform: "translateY(18px) scale(.97)" }, { opacity: 1, transform: "none" }], { duration: 550, delay: (first ? 250 : 80) + i * 60, easing: curve, fill: "backwards" }); });
  // bars and charts grow in
  nx.querySelectorAll(".vbars .b i, .bars i").forEach((b, i) => b.animate([{ transform: "scaleY(0)" }, { transform: "none" }], { duration: 600, delay: 200 + i * 40, easing: curve, fill: "backwards" }));
}
document.querySelectorAll("#seg button").forEach(b => b.onclick = () => show(b.dataset.v));
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("spotLayer").hidden ? openSpot() : closeLayer($("spotLayer")); return; }
  if (e.key === "Escape") { closeLayer($("spotLayer")); closeLayer($("sheetLayer")); return; }
  if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey || !$("sheetLayer").hidden) return;
  const i = ["1", "2", "3", "4", "5", "6", "7"].indexOf(e.key); if (i >= 0) show(VIEWS[i]);
});
addEventListener("resize", () => moveThumb(true));
if (M) {   // press feedback
  let held = null;
  document.addEventListener("pointerdown", e => { held = e.target.closest(".btn, .tile, .wknav button, .seg button, .daystrip button, .pill, .open"); if (held) M.animate(held, { scale: .95 }, spring); });
  const release = () => { if (held) { M.animate(held, { scale: 1 }, spring); held = null; } };
  document.addEventListener("pointerup", release); document.addEventListener("pointercancel", release);
}

/* ---------- first paint ---------- */
function renderAll() {
  renderGoals(); renderTracker(); renderPlan();
  renderRoutine("tMorning", "morning-routine", "☀️ Morning Routine", "var(--yellow)", false);
  renderRoutine("tNight", "night-routine", "🌙 Night Routine", "var(--indigo)", true);
  renderGoalsView(); renderWork(); renderPhysical(); renderMoney(); renderContent(); renderRel(); renderMind();
}
renderAll(); renderDock();
show(view, true);
requestAnimationFrame(() => moveThumb(true));
if (document.fonts) document.fonts.ready.then(() => moveThumb(true));
setInterval(() => { renderRoutine("tMorning", "morning-routine", "☀️ Morning Routine", "var(--yellow)", false); renderRoutine("tNight", "night-routine", "🌙 Night Routine", "var(--indigo)", true); }, 60000);
if (M) {
  M.animate(".hello, .seg, .weather", { opacity: [0, 1], y: [-14, 0] }, { delay: M.stagger(.08), duration: .7, ease });
  M.animate(".side", { opacity: [0, 1], x: [-24, 0] }, { duration: .7, ease });
  M.animate(".dock", { opacity: [0, 1], y: [40, 0] }, { duration: .7, delay: .1, ease });
  M.animate("#wIcon", { y: [0, -3, 0] }, { duration: 4, repeat: Infinity, ease: "easeInOut" });
}
</script>
