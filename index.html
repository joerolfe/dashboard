<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locked IN</title>
<style>
  :root {
    --text: #fff;
    --muted: rgba(255, 255, 255, .62);
    --faint: rgba(255, 255, 255, .36);
    --hair: rgba(255, 255, 255, .1);
    --glass: rgba(22, 22, 28, .38);
    --stroke: rgba(255, 255, 255, .16);
    --blue: #0A84FF; --green: #30D158; --orange: #FF9F0A; --red: #FF453A;
    --purple: #BF5AF2; --yellow: #FFD60A; --teal: #64D2FF; --pink: #FF375F; --gray: #8E8E93; --indigo: #5E5CE6;
    --r: 24px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
    color: var(--text); background: #0b0b0f; -webkit-font-smoothing: antialiased; letter-spacing: -.01em;
  }
  button, input { font: inherit; color: inherit; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* ---------- background ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; }
  .photo { position: absolute; inset: 0; background: #1a1612 url("bg.jpg") center / cover no-repeat; transform: scale(1.03); }
  .shade { position: absolute; inset: 0; background: linear-gradient(rgba(8,8,12,.42), rgba(8,8,12,.6)); transition: background 1.2s; }
  .glass {
    background: var(--glass); border: 1px solid var(--stroke);
    -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 24px 60px -28px rgba(0,0,0,.7);
  }

  /* ---------- frame: sidebar | header + stage, dock underneath — always one screen ---------- */
  .app {
    position: relative; z-index: 1; height: 100vh; height: 100dvh; max-width: 1600px; margin: 0 auto; padding: 20px 26px 12px;
    display: grid; grid-template-columns: 190px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 16px 18px;
  }
  .side { grid-column: 1; grid-row: 1 / 3; border-radius: 22px; padding: 16px 10px; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: hidden; }
  .top, .stage { grid-column: 2; }
  .dockwrap { grid-column: 1 / -1; }

  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; }
  .hello h1 { font-size: 22px; font-weight: 700; letter-spacing: -.025em; white-space: nowrap; }
  .hello p { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .seg { position: relative; display: flex; padding: 4px; border-radius: 99px; }
  .seg button { all: unset; position: relative; z-index: 1; cursor: pointer; padding: 8px 15px; border-radius: 99px; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: color .25s; }
  .seg button:hover { color: var(--text); }
  .seg button.on { color: #111; }
  .seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 99px; background: rgba(255,255,255,.94); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .weather { justify-self: end; display: flex; align-items: center; gap: 10px; padding: 7px 18px 7px 12px; border-radius: 99px; }
  .weather .wi { font-size: 26px; line-height: 1; cursor: pointer; }
  .weather .wc { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .weather .wl { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- sidebar ---------- */
  .spotbtn { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 11px; background: rgba(255,255,255,.08); font-size: 13px; color: var(--muted); transition: background .2s; }
  .spotbtn:hover { background: rgba(255,255,255,.15); color: var(--text); }
  .spotbtn kbd { margin-left: auto; font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.1); }
  .sgroup { display: flex; flex-direction: column; gap: 1px; }
  .sgroup .cap { padding: 0 10px 6px; }
  .side a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 13.5px; font-weight: 500; transition: background .15s; }
  .side a:hover { background: rgba(255,255,255,.12); }
  .side a span { color: var(--faint); font-size: 12px; opacity: 0; transition: opacity .15s; }
  .side a:hover span { opacity: 1; }

  /* ---------- views + cards ---------- */
  .stage { position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; display: none; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .view.active { display: grid; }
  .w { border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; overflow: hidden; }
  .tall { grid-row: span 2; }
  .wide { grid-column: span 2; }
  .wh { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .wh .ttl { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wh .side-r { display: flex; align-items: center; gap: 8px; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .open { all: unset; cursor: pointer; flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); color: var(--muted); font-size: 12px; transition: background .2s, color .2s; }
  .open:hover { background: rgba(255,255,255,.22); color: var(--text); }
  .cap { flex: none; font-size: 11px; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
  .hint { font-size: 12px; color: var(--faint); font-weight: 500; }
  .empty { color: var(--faint); font-size: 13.5px; text-align: center; margin: auto; padding: 10px; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; margin-right: -8px; padding-right: 8px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
  .scroll > * + * { margin-top: 12px; }
  .fill { flex: 1; min-height: 0; }

  .input { min-width: 0; padding: 8px 12px; border-radius: 11px; font-size: 13.5px; outline: none; background: rgba(255,255,255,.08); border: 1px solid transparent; transition: border-color .2s, background .2s; }
  .input:focus { border-color: rgba(10,132,255,.85); background: rgba(255,255,255,.12); }
  .input::placeholder { color: var(--faint); }
  .btn { all: unset; cursor: pointer; padding: 8px 15px; border-radius: 11px; font-size: 13.5px; font-weight: 600; text-align: center; background: var(--blue); color: #fff; transition: filter .2s; }
  .btn:hover { filter: brightness(1.12); }
  .addrow { flex: none; display: flex; gap: 8px; }
  .addrow .input { flex: 1; }
  .del { all: unset; cursor: pointer; opacity: 0; color: var(--faint); font-size: 16px; padding: 0 4px; }
  .del:hover { color: var(--red); }

  /* shared visuals */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 10px; border-radius: 99px; background: rgba(255,255,255,.09); font-size: 12.5px; font-weight: 500; line-height: 1.3; }
  .chip.c { background: color-mix(in srgb, var(--c) 24%, transparent); color: color-mix(in srgb, var(--c) 70%, white); font-weight: 700; }
  .chip.off { color: var(--faint); text-decoration: line-through; }
  .mini { padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.06); }
  .mini h5 { font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
  .mini p, .mini li { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .mini ul { padding-left: 16px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat b { display: block; font-size: 24px; font-weight: 750; letter-spacing: -.03em; line-height: 1.1; }
  .stat small { display: block; font-size: 11.5px; color: var(--faint); margin-top: 3px; line-height: 1.3; }
  .pbar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .pbar i { display: block; height: 100%; width: var(--p, 0%); border-radius: 99px; background: var(--c, var(--green)); transition: width .8s cubic-bezier(.22,1,.36,1); }
  .prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; align-items: center; font-size: 13px; }
  .prow .pbar { grid-column: 1 / -1; }
  .prow em { font-style: normal; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .rows { list-style: none; padding: 0; display: flex; flex-direction: column; }
  .rows li { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-top: 1px solid var(--hair); font-size: 13px; line-height: 1.4; }
  .rows li:first-child { border-top: 0; }
  .rows li em { flex: none; min-width: 58px; font-style: normal; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .rows li .r { margin-left: auto; flex: none; font-size: 12px; color: var(--faint); }
  .rows li.now { color: #fff; }
  .rows li.now em { color: var(--green); font-weight: 700; }
  .rows li.past { color: var(--faint); }
  .ck { flex: none; width: 15px; height: 15px; margin-top: 2px; border-radius: 5px; border: 1.6px solid var(--faint); display: inline-grid; place-items: center; }
  .ck.on { background: var(--green); border-color: var(--green); }
  .ck.on::after, .tk.on::after { content: ""; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .tl { list-style: none; padding: 0; position: relative; }
  .tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; border-radius: 2px; background: rgba(255,255,255,.12); }
  .tl li { position: relative; padding: 0 0 12px 22px; font-size: 13px; line-height: 1.4; }
  .tl li::before { content: ""; position: absolute; left: 0; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #1d1d22; border: 2px solid var(--c, var(--blue)); }
  .tl li.done::before { background: var(--c, var(--green)); }
  .tl li b { display: block; font-size: 13.5px; }
  .tl li small { display: block; color: var(--faint); font-size: 12px; }
  .tl li.late small { color: var(--red); }
  .big { font-size: 40px; font-weight: 750; letter-spacing: -.04em; line-height: 1; }
  .big small { display: block; margin-top: 5px; font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
  .tile { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 13px; background: rgba(255,255,255,.06); cursor: pointer; font-size: 13px; font-weight: 600; transition: background .2s; min-width: 0; }
  .tile:hover { background: rgba(255,255,255,.14); }
  .tile .ti { font-size: 17px; flex: none; }
  .tile span:last-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile small { display: block; font-weight: 500; font-size: 11.5px; color: var(--faint); }
  .daystrip { display: flex; gap: 4px; }
  .daystrip button { all: unset; cursor: pointer; flex: 1; text-align: center; padding: 5px 0; border-radius: 9px; font-size: 11.5px; font-weight: 700; color: var(--muted); background: rgba(255,255,255,.05); transition: background .2s; }
  .daystrip button:hover { background: rgba(255,255,255,.12); }
  .daystrip button.today { box-shadow: inset 0 0 0 1px rgba(255,69,58,.8); }
  .daystrip button.on { background: rgba(255,255,255,.9); color: #111; }
  .quote { padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.06); border-left: 3px solid var(--purple); font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.85); }
  .tbl { overflow-x: auto; border: 1px solid var(--hair); border-radius: 13px; }
  .tbl table { width: 100%; border-collapse: collapse; font-size: 12.5px; line-height: 1.4; }
  .tbl th, .tbl td { padding: 7px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--hair); }
  .tbl th { background: rgba(255,255,255,.07); font-weight: 700; white-space: nowrap; }
  .tbl tbody tr:last-child td { border-bottom: 0; }
  .tbl td.hl, .tbl th.hl { background: rgba(255,69,58,.14); }

  /* ---------- financial: Money | Content switch on top of each half ---------- */

  /* ---------- daily/weekly ---------- */
  #v-today { grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); }
  .ring { position: relative; width: 50px; height: 50px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
  .ring .track { stroke: rgba(255,255,255,.12); }
  .ring .bar { transition: stroke-dashoffset .8s cubic-bezier(.22,1,.36,1); }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .gtop { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .gtop h2 { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
  .gtop p { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .glist { list-style: none; padding: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1px; }
  .glist li { flex: 1 1 0; min-height: 0; max-height: 40px; display: flex; align-items: center; gap: 11px; padding: 0 8px; border-radius: 11px; cursor: pointer; transition: background .15s; }
  .glist li:hover { background: rgba(255,255,255,.07); }
  .glist li:hover .del { opacity: 1; }
  .check { flex: none; width: 19px; height: 19px; border-radius: 50%; border: 2px solid var(--faint); display: grid; place-items: center; transition: background .2s, border-color .2s; }
  .glist li.done .check, .ex.done .check { background: var(--green); border-color: var(--green); }
  .glist li.done .check::after, .ex.done .check::after, .box.on::after { content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .glist .t { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glist li.done .t { color: var(--faint); text-decoration: line-through; }
  .wknav { display: flex; align-items: center; gap: 6px; }
  .wknav button { all: unset; cursor: pointer; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); color: var(--text); font-size: 14px; }
  .wknav button:hover { background: rgba(255,255,255,.2); }
  .wknav span { min-width: 104px; text-align: center; color: var(--text); }
  .trk { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 20px; }
  .tgrid { display: grid; grid-template-columns: minmax(100px, 1.6fr) repeat(7, minmax(24px, 1fr)); column-gap: 4px; row-gap: 1px; min-height: 0; }
  .tgrid.blank { display: flex; }
  .gname { align-self: center; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
  .dh { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-bottom: 4px; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .dh b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: var(--text); }
  .dh.today b { background: var(--red); }
  .cell { display: grid; place-items: center; border-radius: 7px; }
  .cell.today { background: rgba(255,255,255,.06); }
  .box { width: clamp(14px, 2.2vh, 19px); height: clamp(14px, 2.2vh, 19px); border-radius: 6px; border: 1.6px solid rgba(255,255,255,.28); cursor: pointer; display: grid; place-items: center; transition: background .15s, border-color .15s; }
  .box:hover { border-color: rgba(255,255,255,.7); }
  .box.on { background: var(--green); border-color: var(--green); }
  .foot { padding-top: 4px; text-align: center; font-size: 11px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; }
  .foot.full { color: var(--green); }
  .tstats { min-height: 0; display: flex; flex-direction: column; gap: 8px; padding-left: 18px; border-left: 1px solid var(--hair); }
  .srow { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--hair); }
  .srow span { color: var(--muted); }
  .bars { flex: 1; min-height: 36px; display: flex; gap: 6px; align-items: flex-end; }
  .bars div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; font-size: 10.5px; color: var(--muted); }
  .bars i { display: block; width: 100%; min-height: 3px; border-radius: 5px; background: rgba(10,132,255,.75); transform-origin: bottom; }
  .bars div.cur i { background: var(--green); }

  /* ---------- gym workout ---------- */
  .wtabs { display: flex; gap: 4px; }
  .wtabs button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--muted); background: rgba(255,255,255,.06); white-space: nowrap; }
  .wtabs button.on { color: #fff; background: color-mix(in srgb, var(--c) 34%, transparent); }
  .wsplit { flex: none; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .wsplit button { all: unset; box-sizing: border-box; cursor: pointer; text-align: center; padding: 7px 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; color: var(--faint); background: rgba(255,255,255,.05); border: 1px solid transparent; transition: background .2s, border-color .2s; }
  .wsplit button b { display: block; margin-top: 2px; font-size: 13px; font-weight: 700; color: color-mix(in srgb, var(--c) 70%, #fff); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wsplit button:hover:not(.rest) { background: rgba(255,255,255,.1); }
  .wsplit button.on { background: color-mix(in srgb, var(--c) 22%, transparent); }
  .wsplit button.today { border-color: color-mix(in srgb, var(--c) 80%, transparent); color: #fff; }
  .wsplit button.rest { cursor: default; }
  .wsplit button.rest b { color: var(--faint); }
  .wstats { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .wstats .mini { padding: 8px 10px; }
  .wstats b { display: block; font-size: 19px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .wstats small { display: block; font-size: 11px; color: var(--faint); margin-top: 1px; }
  .wstats .track { height: 4px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 6px; }
  .wstats .track i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .6s cubic-bezier(.22,1,.36,1); }
  .whead, .ex { display: grid; grid-template-columns: 22px minmax(0, 1fr) 100px 100px 64px 120px 50px; align-items: center; gap: 10px; padding: 0 8px; }
  .whead { flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .whead span:nth-child(n+3):nth-child(-n+6) { text-align: center; }
  .ex .kg.nx b { color: var(--green); }
  .wlist { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1px; }
  .ex { flex: 1 1 0; min-height: 0; max-height: 50px; border-radius: 11px; cursor: pointer; transition: background .15s; }
  .ex:hover { background: rgba(255,255,255,.07); }
  .ex .nm { min-width: 0; }
  .ex .nm b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex .nm small { display: block; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex.done .nm b { color: var(--faint); text-decoration: line-through; }
  .ex .kg { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ex .kg b { display: block; font-size: 14px; font-weight: 700; }
  .ex .kg small { display: block; font-size: 11px; color: var(--faint); }
  .ex .reps { width: 100%; box-sizing: border-box; text-align: center; padding: 6px 4px; border-radius: 9px; border: 1px solid var(--hair); background: rgba(255,255,255,.06); color: #fff; font: inherit; font-size: 13px; font-weight: 600; outline: none; -moz-appearance: textfield; }
  .ex .reps::-webkit-inner-spin-button { -webkit-appearance: none; }
  .ex .reps:focus { border-color: var(--c); background: rgba(255,255,255,.1); }
  .ex .st { all: unset; box-sizing: border-box; text-align: center; padding: 5px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 700; white-space: nowrap; color: var(--faint); background: rgba(255,255,255,.05); }
  .ex .st.up { cursor: pointer; color: #04210f; background: var(--green); box-shadow: 0 0 0 3px rgba(48,209,88,.18); }
  .ex .st.up:hover { filter: brightness(1.1); }
  .ex .st.hold { color: var(--yellow); background: rgba(255,214,10,.13); }
  .ex .st.low { color: var(--red); background: rgba(255,69,58,.13); }
  .ex .acts { display: flex; gap: 3px; justify-content: flex-end; opacity: 0; transition: opacity .15s; }
  .ex:hover .acts { opacity: 1; }
  .ex .acts button { all: unset; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: rgba(255,255,255,.12); }
  .ex .acts button:hover { background: rgba(255,255,255,.26); }
  .whint { flex: none; font-size: 11.5px; color: var(--faint); text-align: center; }

  const reset = el => { el.getAnimations().forEach(a => a.cancel()); el.style.opacity = ""; el.style.transform = ""; };
  if (!first && pv !== nx) {
    pv.style.pointerEvents = "none";
    const outs = [...pv.querySelectorAll(":scope > .w")].map(c => c.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-10px) scale(.98)" }], { duration: 180, easing: curve, fill: "forwards" }));
    Promise.all(outs.map(a => a.finished)).then(() => { if (view !== prev) { pv.classList.remove("active"); outs.forEach(a => a.cancel()); } }).catch(() => {}).finally(() => { pv.style.pointerEvents = ""; });
  }
  reset(nx);
  nx.animate([{ transform: `translateX(${first ? 0 : dir * 36}px)` }, { transform: "none" }], { duration: 500, easing: curve });
  [...nx.querySelectorAll(":scope > .w")].forEach((c, i) => { reset(c); c.animate([{ opacity: 0, transform: "translateY(18px) scale(.97)" }, { opacity: 1, transform: "none" }], { duration: 550, delay: (first ? 250 : 80) + i * 60, easing: curve, fill: "backwards" }); });
  // bars and charts grow in
  nx.querySelectorAll(".vbars .b i, .bars i").forEach((b, i) => b.animate([{ transform: "scaleY(0)" }, { transform: "none" }], { duration: 600, delay: 200 + i * 40, easing: curve, fill: "backwards" }));
}
document.querySelectorAll("#seg button").forEach(b => b.onclick = () => show(b.dataset.v));
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("spotLayer").hidden ? openSpot() : closeLayer($("spotLayer")); return; }
  if (e.key === "Escape") { closeLayer($("spotLayer")); closeLayer($("sheetLayer")); return; }
  if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey || !$("sheetLayer").hidden) return;
  const i = SECTIONS.findIndex((_, n) => String(n + 1) === e.key); if (i >= 0) show(SECTIONS[i][0]);
});
addEventListener("resize", () => moveThumb(true));
if (M) {   // press feedback
  let held = null;
  document.addEventListener("pointerdown", e => { held = e.target.closest(".btn, .tile, .wknav button, .seg button, .minis button, .daystrip button, .pill, .open"); if (held) M.animate(held, { scale: .95 }, spring); });
  const release = () => { if (held) { M.animate(held, { scale: 1 }, spring); held = null; } };
  document.addEventListener("pointerup", release); document.addEventListener("pointercancel", release);
}

/* ---------- first paint ---------- */
function renderAll() {
  renderGoals(); renderTracker(); renderPlan();
  renderRoutine("tMorning", "morning-routine", "☀️ Morning Routine", "var(--yellow)", false);
  renderRoutine("tNight", "night-routine", "🌙 Night Routine", "var(--indigo)", true);
  renderGoalsView(); renderWork(); renderFinancial();
}
renderAll(); renderDock();
show(view, true);
requestAnimationFrame(() => moveThumb(true));
if (document.fonts) document.fonts.ready.then(() => moveThumb(true));
setInterval(() => { renderRoutine("tMorning", "morning-routine", "☀️ Morning Routine", "var(--yellow)", false); renderRoutine("tNight", "night-routine", "🌙 Night Routine", "var(--indigo)", true); }, 60000);
if (M) {
  M.animate(".hello, .seg, .weather", { opacity: [0, 1], y: [-14, 0] }, { delay: M.stagger(.08), duration: .7, ease });
  M.animate(".side", { opacity: [0, 1], x: [-24, 0] }, { duration: .7, ease });
  M.animate(".dock", { opacity: [0, 1], y: [40, 0] }, { duration: .7, delay: .1, ease });
  M.animate("#wIcon", { y: [0, -3, 0] }, { duration: 4, repeat: Infinity, ease: "easeInOut" });
}
</script>
