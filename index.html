<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  :root {
    --text: #f4f5f9;
    --muted: rgba(244, 245, 249, .55);
    --glass: rgba(255, 255, 255, .10);
    --glass-border: rgba(255, 255, 255, .22);
    --accent: #6ea8ff;
    --good: #5eead4;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
    color: var(--text);
    background: #0b0d14;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ambient background */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; transition: filter 1s; }
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* drop a photo named bg.jpg next to index.html to replace the drawn scene */
  .photo { position: absolute; inset: 0; background: url("bg.jpg") center / cover no-repeat; }
  .shade { position: absolute; inset: 0; background: linear-gradient(rgba(10,10,16,.35), rgba(10,10,16,.55)); transition: background 1s; }
  .grain { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  main {
    position: relative; z-index: 2;
    max-width: 1080px; margin: 0 auto;
    padding: 56px 28px 40px;
    min-height: 100%;
    display: flex; flex-direction: column; gap: 28px;
  }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .greeting { font-size: clamp(30px, 4.4vw, 46px); font-weight: 650; letter-spacing: -.02em; }
  .date { color: var(--muted); margin-top: 6px; font-size: 16px; }
  .clock { font-size: clamp(40px, 6vw, 64px); font-weight: 300; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .clock small { font-size: .32em; color: var(--muted); margin-left: 6px; letter-spacing: 0; }

  .grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 20px; flex: 1; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    padding: 26px;
    backdrop-filter: blur(28px) saturate(150%);
    -webkit-backdrop-filter: blur(28px) saturate(150%);
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    display: flex; flex-direction: column; gap: 20px;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .card:nth-child(2) { animation-delay: .1s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .label button { all: unset; cursor: pointer; text-transform: none; letter-spacing: 0; font-size: 12.5px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--glass-border); }
  .label button:hover { background: rgba(255,255,255,.1); }

  /* weather */
  .now { display: flex; align-items: center; gap: 18px; }
  .icon { font-size: 76px; line-height: 1; filter: drop-shadow(0 8px 24px rgba(0,0,0,.35)); }
  .temp { font-size: 84px; font-weight: 250; letter-spacing: -.05em; line-height: .95; cursor: pointer; }
  .cond { font-size: 20px; font-weight: 500; margin-top: 4px; }
  .loc { color: var(--muted); font-size: 14px; margin-top: 2px; cursor: pointer; }
  .loc:hover { color: var(--text); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: rgba(255,255,255,.05); border-radius: 16px; padding: 12px 14px; }
  .stat b { display: block; font-size: 17px; font-weight: 600; margin-top: 3px; }
  .stat span { font-size: 11.5px; color: var(--muted); }
  .hours { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .hours::-webkit-scrollbar { display: none; }
  .hour { flex: 0 0 auto; width: 58px; text-align: center; padding: 10px 0; border-radius: 16px; background: rgba(255,255,255,.04); font-size: 13px; }
  .hour:first-child { background: rgba(110,168,255,.2); }
  .hour div:nth-child(2) { font-size: 20px; margin: 5px 0; }
  .hour div:first-child { color: var(--muted); font-size: 12px; }

  /* goals */
  .progress { display: flex; align-items: center; gap: 18px; }
  .ring { width: 74px; height: 74px; flex: none; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
  .ring .track { stroke: rgba(255,255,255,.1); }
  .ring .bar { stroke: var(--good); transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 600; font-size: 16px; }
  .progress h2 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .progress p { color: var(--muted); font-size: 14px; margin-top: 3px; }

  ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 340px; }
  li { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid transparent; transition: background .2s, border-color .2s; animation: rise .35s both; }
  li:hover { background: rgba(255,255,255,.09); }
  li.done span.t { text-decoration: line-through; color: var(--muted); }
  .check { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); cursor: pointer; display: grid; place-items: center; transition: all .2s; }
  li.done .check { background: var(--good); border-color: var(--good); }
  li.done .check::after { content: ""; width: 5px; height: 10px; border: solid #0b0d14; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .t { flex: 1; font-size: 16px; word-break: break-word; }
  .del { all: unset; cursor: pointer; opacity: 0; color: var(--muted); font-size: 18px; padding: 0 4px; }
  li:hover .del { opacity: 1; }
  .del:hover { color: #ff8787; }
  .empty { color: var(--muted); text-align: center; padding: 26px 0; font-size: 15px; }

  form { display: flex; gap: 10px; margin-top: auto; }
  input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text);
    background: rgba(255,255,255,.06); border: 1px solid var(--glass-border);
    border-radius: 16px; padding: 14px 16px; outline: none; transition: border-color .2s, background .2s;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--accent); background: rgba(255,255,255,.09); }
  form button { font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 16px; padding: 0 22px; color: #0b0d14; background: var(--accent); transition: transform .15s, filter .15s; }
  form button:hover { filter: brightness(1.1); transform: translateY(-1px); }

  footer { text-align: center; color: var(--muted); font-size: 13px; }

  /* links sidebar */
  main { padding-left: 124px; }
  .dock {
    position: fixed; z-index: 3; left: 20px; top: 20px; bottom: 20px; width: 84px;
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 30px;
    backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%);
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    display: flex; flex-direction: column; padding: 14px 0; animation: rise .7s both;
  }
  .links { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 8px; scrollbar-width: none; }
  .links::-webkit-scrollbar { display: none; }
  .link { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 2px 8px; border-radius: 18px; color: var(--text); text-decoration: none; transition: background .2s, transform .2s; }
  .link:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }
  .link .ic { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.92); display: grid; place-items: center; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .link .ic img { width: 26px; height: 26px; object-fit: contain; }
  .link .ic b { color: #0b0d14; font-size: 17px; }
  .link span { font-size: 10.5px; color: var(--muted); max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link:hover span { color: var(--text); }
  .link .x { position: absolute; top: 4px; right: 4px; width: 17px; height: 17px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; line-height: 17px; text-align: center; display: none; }
  .link:hover .x { display: block; }
  .add { all: unset; cursor: pointer; align-self: center; margin-top: 8px; width: 38px; height: 38px; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.4); display: grid; place-items: center; font-size: 20px; color: var(--muted); transition: all .2s; }
  .add:hover { color: var(--text); border-color: var(--text); background: rgba(255,255,255,.1); }
  @media (max-width: 640px) { main { padding-left: 110px; } .dock { width: 72px; } }

  /* compact layout: weather + goals tucked to the left, tracker beneath */
  main { max-width: none; margin: 0; }
  header { align-items: flex-start; }
  #weather { flex: none; }
  #goals ul { max-height: 230px; }
  /* goals + tracker side by side, equal height */
  .grid { grid-template-columns: 380px minmax(0, 1fr); align-items: stretch; flex: none; gap: 18px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  /* entrances are driven by Motion in JS */
  .card, .dock, li { animation: none !important; }
  .link:hover { transform: none; }

  #weather { flex-direction: row; align-items: center; padding: 12px 20px; gap: 14px; border-radius: 20px; }
  #weather .icon { cursor: pointer; font-size: 34px; }
  #weather .cond { font-size: 15px; font-weight: 600; }
  #weather .hl { font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  #weather .loc { font-size: 11px; margin-top: 2px; }
  #weather .loc:empty { display: none; }
  #goals { padding: 20px; gap: 14px; border-radius: 22px; }
  #goals ul { max-height: 190px; }
  #goals li { padding: 10px 12px; }
  #goals .t { font-size: 15px; }
  #goals .progress h2 { font-size: 18px; }
  #goals .ring { width: 60px; height: 60px; }
  #goals .ring svg { width: 60px; height: 60px; }

  /* weekly tracker */
  .wk { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 13px; }
  .wk button { padding: 2px 11px; font-size: 15px; }
  .trk { display: flex; gap: 26px; align-items: stretch; flex-wrap: wrap; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; flex: 1 1 380px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 0 8px; border-radius: 16px; background: rgba(255,255,255,.04); }
  .day.today { background: rgba(110,168,255,.18); box-shadow: inset 0 0 0 1px rgba(110,168,255,.45); }
  .day .dn { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.25; }
  .day .dn b { display: block; color: var(--text); font-size: 15px; font-weight: 600; }
  .box { width: 24px; height: 24px; border-radius: 8px; border: 1.6px solid rgba(255,255,255,.28); cursor: pointer; display: grid; place-items: center; transition: all .15s; }
  .box:hover { border-color: rgba(255,255,255,.7); background: rgba(255,255,255,.1); }
  .box.on { background: var(--good); border-color: var(--good); }
  .box.on::after { content: ""; width: 5px; height: 10px; border: solid #0b0d14; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .day .cnt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .day.full .cnt { color: var(--good); font-weight: 600; }
  .tstats { flex: 0 0 210px; display: flex; flex-direction: column; gap: 12px; }
  .tstats .big { font-size: 44px; font-weight: 250; letter-spacing: -.04em; line-height: 1; }
  .tstats .big span { display: block; font-size: 12px; color: var(--muted); letter-spacing: 0; font-weight: 400; margin-top: 4px; }
  .tstats .row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.1); }
  .tstats .row span { color: var(--muted); }
  .tstats .row b { font-weight: 600; }
  .tstats .wks { display: flex; gap: 6px; align-items: flex-end; height: 56px; }
  .tstats .wks div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 3px; font-size: 10.5px; color: var(--muted); }
  .tstats .wks i { display: block; width: 100%; border-radius: 6px; background: linear-gradient(var(--accent), rgba(110,168,255,.35)); min-height: 3px; }
  .tstats .wks div:last-child i { background: linear-gradient(var(--good), rgba(94,234,212,.35)); }
  .tstats small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

  /* tracker grid: goal names down the side, days across */
  .days { grid-template-columns: minmax(90px, 1.6fr) repeat(7, minmax(30px, 1fr)); gap: 6px; align-items: center; align-content: start; }
  .days.blank { display: block; }
  .gname { font-size: 14px; padding-right: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dh { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.25; padding: 6px 0; border-radius: 12px; }
  .dh b { display: block; color: var(--text); font-size: 15px; font-weight: 600; }
  .dh.cnt { font-size: 12px; font-variant-numeric: tabular-nums; }
  .dh.full { color: var(--good); font-weight: 600; }
  .dh.today, .cell.today { background: rgba(110,168,255,.16); }
  .cell { display: grid; place-items: center; padding: 3px 0; border-radius: 10px; }

  /* top tabs */
  .tabs { align-self: flex-start; display: flex; gap: 4px; padding: 5px; border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); box-shadow: 0 12px 30px -14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500; padding: 9px 18px; border-radius: 99px; white-space: nowrap; transition: background .2s; }
  .tabs a:hover { background: rgba(255,255,255,.16); }
  main { padding-top: 32px; }

  /* top bar: tabs left, uni + weather right */
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .uni { position: relative; }
  .unibtn { all: unset; cursor: pointer; font-size: 14px; font-weight: 500; padding: 14px 20px; border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); box-shadow: 0 12px 30px -14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); transition: background .2s; }
  .unibtn:hover, .unibtn[aria-expanded="true"] { background: rgba(255,255,255,.18); }
  .unibtn span { font-size: 11px; margin-left: 4px; opacity: .7; }
  .menu { position: absolute; z-index: 20; top: calc(100% + 10px); right: 0; min-width: 200px; padding: 8px; border-radius: 20px; display: none; flex-direction: column; gap: 2px; background: rgba(30,30,38,.55); border: 1px solid var(--glass-border); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); box-shadow: 0 24px 50px -16px rgba(0,0,0,.6); }
  .menu.open { display: flex; }
  .menu a { color: var(--text); text-decoration: none; font-size: 14px; padding: 10px 14px; border-radius: 12px; transition: background .15s; }
  .menu a:hover { background: rgba(255,255,255,.14); }

  header { justify-content: space-between; align-items: center; text-align: left; }
  main { gap: 20px; }

  /* uni: four link boxes */
  .uni { display: flex; align-items: center; gap: 6px; padding: 5px 5px 5px 16px; border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); box-shadow: 0 12px 30px -14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); }
  .unilabel { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-right: 4px; }
  .uni a { color: var(--text); text-decoration: none; font-size: 13.5px; font-weight: 500; padding: 9px 14px; border-radius: 99px; background: rgba(255,255,255,.08); white-space: nowrap; transition: background .2s; }
  .uni a:hover { background: rgba(255,255,255,.2); }

  /* daily goals: show everything, no inner scrolling */
  #goals { gap: 12px; }
  #goals ul { max-height: none; overflow: visible; gap: 5px; }
  #goals li { padding: 7px 12px; gap: 10px; border-radius: 13px; }
  #goals .check { width: 20px; height: 20px; }
  #goals .t { font-size: 14.5px; }
  #goals .empty { padding: 14px 0; }

  /* fit-to-screen: compact vertical rhythm so nothing needs scrolling */
  main { padding-top: 22px; padding-bottom: 18px; gap: 14px; }
  footer { display: none; }
  .greeting { font-size: clamp(22px, 3.6vh, 32px); }
  .date { font-size: 14px; margin-top: 2px; }
  .tabs a { padding: 7px 16px; }
  .uni a { padding: 7px 13px; }
  .grid { gap: 14px; }
  #goals, #tracker { padding: 16px 20px; gap: 10px; }
  #goals .progress { gap: 12px; }
  #goals .ring, #goals .ring svg { width: 46px; height: 46px; }
  #goals .ring span { font-size: 13px; }
  #goals .progress h2 { font-size: 16px; }
  #goals .progress p { font-size: 12.5px; margin-top: 1px; }
  #goals ul { gap: clamp(2px, .6vh, 5px); }
  #goals li { padding: clamp(4px, .9vh, 8px) 12px; }
  #goals .t { font-size: 14px; }
  #goals .check { width: 18px; height: 18px; }
  #goals input { padding: 9px 14px; font-size: 14px; border-radius: 14px; }
  #goals form button { border-radius: 14px; }
  .days { gap: clamp(2px, .5vh, 5px) 6px; }
  .box { width: clamp(18px, 2.7vh, 24px); height: clamp(18px, 2.7vh, 24px); border-radius: 7px; }
  .cell { padding: 1px 0; }
  .dh { padding: 3px 0; }
  .gname { font-size: 13.5px; }
  .tstats { gap: 8px; }
  .tstats .big { font-size: 36px; }
  .tstats .row { padding: 5px 0; }
  .tstats .wks { height: 44px; }

  /* tracker fills its card: rows stretch, stats panel spreads out */
  #tracker .trk { flex: 1; min-height: 0; }
  #tracker .days { align-content: stretch; }
  .tstats { justify-content: space-between; }
  .tstats > div:last-child { flex: 1; display: flex; flex-direction: column; }
  .tstats .wks { flex: 1; height: auto; min-height: 44px; }
</style>
</head>
<body>
<div class="bg" id="bg">
  <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7f9bc4"/><stop offset=".45" stop-color="#e3b891"/><stop offset=".75" stop-color="#f4cf9c"/><stop offset="1" stop-color="#c99a76"/>
      </linearGradient>
      <radialGradient id="sun" cx=".62" cy=".56" r=".5">
        <stop offset="0" stop-color="#fff3d6" stop-opacity=".95"/><stop offset=".35" stop-color="#ffd9a0" stop-opacity=".45"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8a6b52"/><stop offset="1" stop-color="#3b2c22"/>
      </linearGradient>
      <linearGradient id="chair" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#d9c3a2"/><stop offset="1" stop-color="#a88b66"/>
      </linearGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    </defs>
    <g filter="url(#blur)">
      <rect width="1600" height="740" fill="url(#sky)"/>
      <rect width="1600" height="740" fill="url(#sun)"/>
      <path d="M0 520 C200 440 330 500 520 450 S860 400 1040 460 S1400 420 1600 470 V740 H0Z" fill="#8f8fa6" opacity=".55"/>
      <path d="M0 580 C240 520 420 590 640 540 S1000 520 1200 570 S1480 540 1600 560 V740 H0Z" fill="#6f7088" opacity=".7"/>
      <g fill="#4b4a5e" opacity=".75">
        <rect x="120" y="560" width="26" height="110"/><rect x="152" y="590" width="30" height="80"/><rect x="420" y="570" width="22" height="100"/>
        <rect x="700" y="545" width="34" height="125"/><rect x="740" y="580" width="24" height="90"/><rect x="1010" y="560" width="28" height="110"/>
        <rect x="1250" y="575" width="36" height="95"/><rect x="1480" y="560" width="26" height="110"/>
      </g>
      <path d="M0 640 C260 600 520 650 800 620 S1360 610 1600 640 V740 H0Z" fill="#3d3b4d"/>
    </g>
    <!-- window frames -->
    <g fill="#12131a">

<script src="motion.js"></script>
<script>
const $ = id => document.getElementById(id);
/* ---------- motion helpers (Motion, the framer-motion engine; no-ops if unavailable) ---------- */
const M = matchMedia("(prefers-reduced-motion: reduce)").matches ? null : window.Motion;
const ease = [.2, .8, .2, 1];
const spring = { type: "spring", stiffness: 380, damping: 22 };
function countTo(el, to, fmtFn = v => Math.round(v), from) {
  from = from ?? parseFloat(el.dataset.v ?? 0); el.dataset.v = to;
  if (!M || from === to) { el.textContent = fmtFn(to); return; }
  M.animate(from, to, { duration: .8, ease, onUpdate: v => { el.textContent = fmtFn(v); } });
}
// spring lift on hover, settle on leave
function lift(el, y = -4, scale = 1) {
  if (!M) return;
  el.addEventListener("mouseenter", () => M.animate(el, { y, scale }, spring));
  el.addEventListener("mouseleave", () => M.animate(el, { y: 0, scale: 1 }, spring));
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const NAME = "Joseph"; // change me

/* ---------- links sidebar ---------- */
let links = store.get("links", [
  { name: "Amazon", url: "https://www.amazon.com" },
  { name: "YT Studio", url: "https://studio.youtube.com" },
  { name: "FUT.GG", url: "https://www.fut.gg" }
]);
function renderLinks() {
  const box = $("links"); box.innerHTML = "";
  links.forEach((l, i) => {
    let host = ""; try { host = new URL(l.url).hostname; } catch {}
    const a = document.createElement("a"); a.className = "link"; a.href = l.url;
    a.innerHTML = `<div class="ic"></div><span></span><div class="x" title="Remove">×</div>`;
    a.querySelector("span").textContent = l.name;
    const ic = a.querySelector(".ic"), img = new Image();
    // brand logo (Simple Icons) -> high-res site icon -> first letter
    const slug = host.startsWith("studio.youtube") ? "youtubestudio" : host.replace(/^www\./, "").split(".")[0];
    const stages = [
      `https://cdn.simpleicons.org/${slug}`,
      `https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent("https://" + host)}&size=128`
    ];
    let n = 0; img.src = stages[0];
    img.onerror = () => { if (++n < stages.length) img.src = stages[n]; else ic.innerHTML = `<b>${l.name[0].toUpperCase()}</b>`; };
    ic.appendChild(img);
    a.querySelector(".x").onclick = e => { e.preventDefault(); e.stopPropagation(); links.splice(i, 1); store.set("links", links); renderLinks(); };
    box.appendChild(a);
  });
}
$("addLink").onclick = () => {
  let url = prompt("Link URL (e.g. gmail.com):"); if (!url) return; url = url.trim();
  if (!/^https?:\/\//.test(url)) url = "https://" + url;
  let host; try { host = new URL(url).hostname.replace(/^www\./, ""); } catch { return alert("That doesn't look like a URL."); }
  const name = (prompt("Name:", host.split(".")[0]) || host).trim();
  links.push({ name, url }); store.set("links", links); renderLinks();
};
renderLinks();



/* ---------- clock / greeting ---------- */
function tick() {
  const n = new Date(), h = n.getHours();
  const part = h < 5 ? "night" : h < 12 ? "morning" : h < 17 ? "afternoon" : h < 21 ? "evening" : "night";
  $("greeting").textContent = `Good ${part}, ${NAME}`;
  $("date").textContent = n.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
}
tick(); setInterval(tick, 1000 * 10);

const quotes = [
  "Small steps, every day.", "Focus on what you can control.", "Do the next right thing.",
  "Done is better than perfect.", "Make today count.", "Consistency beats intensity."
];
$("quote").textContent = quotes[new Date().getDate() % quotes.length];

/* ---------- goals: one list shared by the daily card and the weekly tracker ---------- */
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => fmt(new Date());
const uid = () => Math.random().toString(36).slice(2, 9);
let goals = store.get("goals2", null);            // [{ id, text }]
let track = store.get("track2", {});              // { "YYYY-MM-DD": { goalId: true } }
if (!goals) {                                      // first run: carry over today's old list
  goals = []; const old = store.get("goals", {});
  if (old.day === todayKey() && old.items) old.items.forEach(g => {
    const id = uid(); goals.push({ id, text: g.text });
    if (g.done) (track[todayKey()] = track[todayKey()] || {})[id] = true;
  });
  store.set("goals2", goals); store.set("track2", track);
}
// one-time starter goals (added once per browser origin, never re-added after you delete them)
if (!store.get("seed1", false)) {
  ["Vitamins + creatine", "Journal", "Meditate", "Read 30 mins", "Gym (rest if rest day)", "Toes", "4 hours work", "Sleep 8 hours", "Track calories and protein"]
    .forEach(text => { if (!goals.some(g => g.text.toLowerCase() === text.toLowerCase())) goals.push({ id: uid(), text }); });
  store.set("goals2", goals); store.set("seed1", true);
}
const saveGoals = () => store.set("goals2", goals);
const isDone = (k, id) => !!(track[k] && track[k][id]);
const ticks = k => goals.filter(g => isDone(k, g.id)).length;
function toggleGoal(k, id) { track[k] = track[k] || {}; track[k][id] = !track[k][id]; store.set("track2", track); }

function renderGoals(fx) {
  const today = todayKey(), list = $("list"); list.innerHTML = "";
  if (!goals.length) list.innerHTML = `<div class="empty">Nothing here yet — add your first goal ✨</div>`;
  goals.forEach((g, i) => {
    const li = document.createElement("li");
    li.className = isDone(today, g.id) ? "done" : "";
    li.innerHTML = `<div class="check"></div><span class="t"></span><button class="del" title="Delete goal">×</button>`;
    li.querySelector(".t").textContent = g.text;
    const toggle = () => { toggleGoal(today, g.id); renderGoals({ i, type: "pop" }); renderTracker(); };
    li.querySelector(".check").onclick = toggle;
    li.querySelector(".t").onclick = toggle;
    li.querySelector(".del").onclick = async () => {
      if (M) await M.animate(li, { opacity: 0, x: -28 }, { duration: .22, ease }).finished;
      goals.splice(i, 1); saveGoals(); renderGoals(); renderTracker();
    };
    list.appendChild(li);
  });
  const done = ticks(today), total = goals.length;
  const p = total ? done / total : 0;
  $("bar").style.strokeDashoffset = 194.8 * (1 - p);
  countTo($("pct"), Math.round(p * 100), v => Math.round(v) + "%");
  $("gTitle").textContent = !total ? "Set your goals" : done === total ? "All done 🎉" : `${done} of ${total} complete`;
  $("gSub").textContent = !total ? "What matters most today?" : done === total ? "Nice work. Enjoy the rest of your day." : `${total - done} left to go`;
  if (M && fx) {
    const el = list.children[fx.i];
    if (fx.type === "pop") M.animate(el.querySelector(".check"), { scale: [.6, 1.2, 1] }, { duration: .4 });
    if (fx.type === "in") M.animate(el, { opacity: [0, 1], x: [-20, 0], scale: [.96, 1] }, spring);
  }
}
$("form").onsubmit = e => {
  e.preventDefault();
  const text = $("input").value.trim(); if (!text) return;
  goals.push({ id: uid(), text }); $("input").value = ""; saveGoals();
  renderGoals({ i: goals.length - 1, type: "in" }); renderTracker();
};
renderGoals();

/* ---------- weekly tracker: a row per goal, a column per day ---------- */
const SOLID_RATIO = .75; // a "solid" day = 75%+ of goals ticked
let wkOffset = 0, prevPct = 0;
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const isGood = k => goals.length > 0 && ticks(k) / goals.length >= SOLID_RATIO;      // 75%+ (counts toward the streak)
const isPerfect = k => goals.length > 0 && ticks(k) === goals.length;                 // 100%
const isSolid = k => isGood(k) && !isPerfect(k);                                     // 75%+ but not 100%

function weekStats(start) {
  const today = todayKey(); let got = 0, possible = 0, perfect = 0, solid = 0;
  for (let i = 0; i < 7; i++) {
    const k = fmt(addDays(start, i));
    if (k > today) break;
    const t = ticks(k); got += t; possible += goals.length;
    if (isPerfect(k)) perfect++;
    else if (isSolid(k)) solid++;
  }
  return { perfect, solid, pct: possible ? Math.round(got / possible * 100) : 0 };
}

function renderTracker(fx) {
  const start = addDays(mondayOf(new Date()), wkOffset * 7), tk = todayKey();
  const days = $("days"); days.innerHTML = "";
  const add = (cls, html = "") => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; days.appendChild(d); return d; };
  const dates = Array.from({ length: 7 }, (_, i) => addDays(start, i));

  if (!goals.length) {
    days.classList.add("blank"); days.style.gridTemplateRows = ""; add("empty", "Add a goal on the left and it will show up here ✨");
  } else {
    days.classList.remove("blank");
    days.style.gridTemplateRows = `auto repeat(${goals.length}, 1fr) auto`; // goal rows share the card height
    add("dh");
    dates.forEach(d => add("dh" + (fmt(d) === tk ? " today" : ""), `${d.toLocaleDateString(undefined, { weekday: "short" })}<b>${d.getDate()}</b>`));
    goals.forEach(g => {
      add("gname").textContent = g.text;
      dates.forEach(d => {
        const k = fmt(d), cell = add("cell" + (k === tk ? " today" : "")), b = document.createElement("div");
        b.className = "box" + (isDone(k, g.id) ? " on" : ""); b.dataset.k = k; b.dataset.g = g.id;
        b.onclick = () => { toggleGoal(k, g.id); renderTracker({ pop: [k, g.id] }); renderGoals(); };
        cell.appendChild(b);
      });
    });
    add("dh");
    dates.forEach(d => { const k = fmt(d), t = ticks(k); add("dh cnt" + (t === goals.length ? " full" : "") + (k === tk ? " today" : ""), `${t}/${goals.length}`); });
  }

  const fm = { month: "short", day: "numeric" };
  $("wkLabel").textContent = wkOffset === 0 ? "This week" : `${start.toLocaleDateString(undefined, fm)} – ${addDays(start, 6).toLocaleDateString(undefined, fm)}`;
  $("nextW").style.visibility = wkOffset >= 0 ? "hidden" : "visible";

  // stats for the viewed week
  const s = weekStats(start);
  // streak of solid days, ending today (today only counts once it's solid)
  let streak = 0, d = new Date(); if (!isGood(fmt(d))) d = addDays(d, -1);
  while (isGood(fmt(d)) && streak < 3650) { streak++; d = addDays(d, -1); }
  // last 4 weeks
  const thisMon = mondayOf(new Date()); let bars = "";
  for (let w = 3; w >= 0; w--) {
    const ws = weekStats(addDays(thisMon, -7 * w));
    bars += `<div title="${ws.pct}%"><i style="height:${Math.max(ws.pct, 4)}%"></i>${ws.pct}%</div>`;
  }
  $("tstats").innerHTML = `
    <div class="big"><em id="bigNum" style="font-style:normal">${s.pct}</em>%<span>of goals ticked${wkOffset === 0 ? " so far this week" : ""}</span></div>
    <div><div class="row"><span>Perfect days (all goals)</span><b>${s.perfect}</b></div>
    <div class="row"><span>Solid days (${SOLID_RATIO * 100}–99%)</span><b>${s.solid}</b></div>
    <div class="row"><span>Current streak</span><b>${streak ? "🔥 " + streak + (streak === 1 ? " day" : " days") : "—"}</b></div></div>
    <div><small>Last 4 weeks</small><div class="wks" style="margin-top:8px">${bars}</div></div>`;
  countTo($("bigNum"), s.pct, v => Math.round(v), prevPct); prevPct = s.pct;
  if (M && fx) {
    if (fx.pop) { const el = days.querySelector(`[data-k="${fx.pop[0]}"][data-g="${fx.pop[1]}"]`); if (el) M.animate(el, { scale: [.6, 1.18, 1] }, { duration: .35 }); }
    if (fx.dir) {
      M.animate(days, { opacity: [0, 1], x: [fx.dir * 28, 0] }, { duration: .45, ease });
      M.animate(".tstats .wks i", { scaleY: [0, 1] }, { delay: M.stagger(.06), duration: .5, ease });
    }
  }
}
$("prevW").onclick = () => { wkOffset--; renderTracker({ dir: -1 }); };
$("nextW").onclick = () => { if (wkOffset < 0) { wkOffset++; renderTracker({ dir: 1 }); } };
renderTracker();

/* ---------- weather (Open-Meteo, no API key) ---------- */
const WMO = {
  0: ["Clear sky", "☀️", "🌙"], 1: ["Mostly clear", "🌤️", "🌙"], 2: ["Partly cloudy", "⛅", "☁️"], 3: ["Overcast", "☁️", "☁️"],
  45: ["Fog", "🌫️"], 48: ["Freezing fog", "🌫️"],
  51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy drizzle", "🌧️"],
  56: ["Freezing drizzle", "🌧️"], 57: ["Freezing drizzle", "🌧️"],
  61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
  66: ["Freezing rain", "🌧️"], 67: ["Freezing rain", "🌧️"],
  71: ["Light snow", "🌨️"], 73: ["Snow", "❄️"], 75: ["Heavy snow", "❄️"], 77: ["Snow grains", "❄️"],
  80: ["Light showers", "🌦️"], 81: ["Showers", "🌧️"], 82: ["Heavy showers", "⛈️"],
  85: ["Snow showers", "🌨️"], 86: ["Snow showers", "🌨️"],
  95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm, hail", "⛈️"], 99: ["Thunderstorm, hail", "⛈️"]
};
const wmo = (c, night) => { const w = WMO[c] || ["—", "🌡️"]; return [w[0], night && w[2] ? w[2] : w[1]]; };
let wx = null;

function renderWeather() {
  if (!wx) return;
  const c = wx.current, d = wx.daily;
  // today's overall conditions (falls back to current for older cached data)
  const code = d.weather_code ? d.weather_code[0] : c.weather_code;
  const [txt, ico] = wmo(code, false);
  $("wIcon").textContent = ico;
  $("wCond").textContent = code <= 1 ? "Sunny" : txt;
  $("wHL").textContent = `High ${Math.round(d.temperature_2m_max[0])}° · Low ${Math.round(d.temperature_2m_min[0])}°`;
  // darken the scene at night / in bad weather
  const a = !c.is_day ? .78 : c.weather_code >= 51 ? .6 : .4;
  document.querySelector(".shade").style.background = `linear-gradient(rgba(10,10,16,${a - .1}), rgba(10,10,16,${a + .15}))`;
}

async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
    `&timezone=auto&forecast_days=2`;
  const r = await fetch(url); if (!r.ok) throw new Error("weather");
  wx = await r.json(); store.set("wxCache", { t: Date.now(), wx }); renderWeather();
}

async function ipLocate() {
  const r = await fetch("https://ipapi.co/json/"); const j = await r.json();
  if (!j.latitude) throw new Error("ip");
  return { lat: j.latitude, lon: j.longitude, name: `${j.city}, ${j.region_code || j.country_name}` };
}
function geoLocate() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej();
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lon: p.coords.longitude, name: "Your location" }), rej, { timeout: 6000 });
  });
}
async function searchCity(q) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1`);
  const j = await r.json(); const p = j.results && j.results[0];
  if (!p) throw new Error("none");
  return { lat: p.latitude, lon: p.longitude, name: `${p.name}${p.admin1 ? ", " + p.admin1 : ""}` };
}

$("wIcon").onclick = async () => {
  const q = prompt("Enter a city (leave blank to auto-detect):");
  if (q === null) return;
  try {
    const place = q.trim() ? await searchCity(q.trim()) : await ipLocate();
    store.set("place", place); await fetchWeather(place.lat, place.lon);
  } catch { alert("Couldn't find that place."); }
};

(async function initWeather() {
  const cache = store.get("wxCache", null);
  if (cache && Date.now() - cache.t < 10 * 60000) { wx = cache.wx; renderWeather(); }
  try {
    let place = store.get("place", null);
    if (!place) {
      try { place = await ipLocate(); } catch { place = await geoLocate(); }
      store.set("place", place);
    }
    await fetchWeather(place.lat, place.lon);
  } catch {
    if (!wx) { $("wCond").textContent = "Weather unavailable"; $("wLoc").textContent = "Click the icon to set your city"; $("wIcon").textContent = "🌡️"; }
  }
})();
/* ---------- entrance + interaction motion ---------- */
if (M) {
  M.animate(".tabs a", { opacity: [0, 1], y: [-14, 0] }, { delay: M.stagger(.07), duration: .6, ease });
  document.querySelectorAll(".tabs a, .uni a").forEach(a => { lift(a, -2); a.addEventListener("mousedown", () => M.animate(a, { scale: .95 }, spring)); a.addEventListener("mouseup", () => M.animate(a, { scale: 1 }, spring)); });
  M.animate(".dock", { opacity: [0, 1], x: [-30, 0] }, { duration: .7, ease });
  M.animate("header > div", { opacity: [0, 1], y: [-16, 0] }, { delay: M.stagger(.1), duration: .7, ease });
  M.animate(".card", { opacity: [0, 1], y: [28, 0], scale: [.97, 1] }, { delay: M.stagger(.1, { startDelay: .15 }), duration: .8, ease });
  M.animate(".link", { opacity: [0, 1], x: [-16, 0] }, { delay: M.stagger(.06, { startDelay: .4 }), duration: .5, ease });
  M.animate(".days > *", { opacity: [0, 1], y: [10, 0] }, { delay: M.stagger(.012, { startDelay: .7 }), duration: .45, ease });
  M.animate("#wIcon", { y: [0, -5, 0] }, { duration: 4, repeat: Infinity, ease: "easeInOut" });
  document.querySelectorAll(".card").forEach(c => lift(c, -3));
  document.querySelectorAll(".link").forEach(l => {
    lift(l, -2, 1.05);
    l.addEventListener("mousedown", () => M.animate(l, { scale: .94 }, spring));
    l.addEventListener("mouseup", () => M.animate(l, { scale: 1.05 }, spring));
  });
  $("days").addEventListener("mousedown", e => { if (e.target.classList.contains("box")) M.animate(e.target, { scale: .9 }, spring); });
  document.querySelectorAll("form button, .add").forEach(b => b.addEventListener("mousedown", () => M.animate(b, { scale: .9 }, spring)));
}
setInterval(() => { const p = store.get("place", null); if (p) fetchWeather(p.lat, p.lon).catch(() => {}); }, 15 * 60000);
</script>
</body>
</html>
